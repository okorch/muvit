run_name: muvit3d_test

data_dir: /mnt/lustre-grete/projects/nim00020/data/volume-em/cellmap/datasets/roi
output: /mnt/vast-nhr/home/o.korchevaia/u24841/muvit_out    # checkpoints/logs written here
n_channels: 1
crop_size: [512, 512, 512]           # D H W; must divide evenly by patch_size and every value in levels
patch_size: [8, 8, 8]                # one value (e.g. 8) or three (D H W)
levels: "1,4,16"                     # comma-separated resolution factors, finest first

val_fraction: 0.1
