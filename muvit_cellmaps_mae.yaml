num_workers: 4
epochs: 10
lr: null

num_layers: 12
num_layers_decoder: 4
dim: 512
dim_decoder: 256
heads: 8
masking_ratio: 0.75

normalize: percentile                # percentile | minmax | none
logger: tensorboard                  # tensorboard | wandb | none
seed: 42
dry: false                           # true = fast sanity-check run, no logging/checkpoints